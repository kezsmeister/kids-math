<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Math Garden</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#fff3d6" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%8C%B7%3C/text%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="styles/game.css" />
  </head>
  <body>
    <div id="app">
      <section id="home" class="screen on">
        <div class="hhead">
          <div class="logo"><span>🌷</span> Math Garden</div>
          <div class="starbadge">⭐ <span id="starCount">0</span></div>
          <div class="toggles">
            <button class="rbtn" id="tSound" aria-label="Sound effects">
              🔔
            </button>
            <button
              class="rbtn"
              id="tVoice"
              aria-label="Read essential questions aloud"
              title="Read essential questions aloud"
            >
              🗣️
            </button>
          </div>
        </div>
        <div class="modebar">
          <button class="modebtn" id="m10">0 – 10</button>
          <button class="modebtn" id="m20">11 – 20</button>
        </div>
        <div class="cards" id="cards"></div>
        <div class="bottombar">
          <div class="parentwrap">
            <button
              id="parentBtn"
              aria-label="Parent corner. Hold for three seconds, or press Enter."
            >
              <span>👪</span>
            </button>
            <div>Parents · hold 3 sec</div>
          </div>
          <button class="stickerbtn" id="stkBtn">
            🎁 <span id="stkCount">0</span>/<span id="stkTotal">24</span>
          </button>
        </div>
      </section>

      <section id="act" class="screen">
        <div class="top">
          <button class="rbtn" id="homeBtn" aria-label="Home">🏠</button>
          <div class="round-progress">
            <div class="progress" id="progress" role="img"></div>
            <span id="roundLabel" aria-hidden="true"></span>
          </div>
          <div class="lvpill" id="lvpill" role="img"></div>
          <button class="rbtn" id="replayBtn" aria-label="Read question" hidden>
            🔊
          </button>
        </div>
        <div class="promptbar"><h1 id="prompt" tabindex="-1"></h1></div>
        <div class="lesson-help">
          <button id="readQuestionBtn" class="text-button" hidden>
            <span class="control-icon" aria-hidden="true">🔊</span
            ><span>Listen</span>
          </button>
          <button
            id="hintBtn"
            class="text-button"
            aria-label="Help with this question"
          >
            <span class="control-icon" aria-hidden="true">💡</span
            ><span>Help</span>
          </button>
        </div>
        <div
          id="speechStatus"
          class="teaching-status"
          role="status"
          aria-live="polite"
        ></div>
        <div
          id="helpStatus"
          class="teaching-status"
          role="status"
          aria-live="polite"
        ></div>
        <div class="stageOuter"><div id="stage"></div></div>
        <div class="fb">
          <div
            class="fbtext"
            id="fbtext"
            role="status"
            aria-live="polite"
            aria-atomic="true"
          ></div>
          <button id="nextBtn" aria-label="Next">
            Next <span aria-hidden="true">➜</span>
          </button>
        </div>
      </section>

      <section id="res" class="screen">
        <div class="center" id="resBody"></div>
      </section>

      <section id="stk" class="screen">
        <div class="hdr">
          <button class="rbtn" id="stkBack" aria-label="Home">🏠</button>
          <h1>My Stickers 🎁</h1>
          <div class="starbadge">⭐ <span id="starCount2">0</span></div>
        </div>
        <div class="stkgrid" id="stkGrid"></div>
      </section>

      <section id="par" class="screen">
        <div class="hdr">
          <button class="rbtn" id="parBack" aria-label="Close parent corner">
            ✖
          </button>
          <h1>👪 Parent corner</h1>
        </div>
        <div class="parbody" id="parBody"></div>
      </section>
    </div>
    <div id="fx" aria-hidden="true"></div>

    <script defer src="src/dom.js"></script>
    <script defer src="src/curriculum.js"></script>
    <script defer src="src/state.js"></script>
    <script defer src="src/question-voice-data.js"></script>
    <script defer src="src/recorded-voice.js"></script>
    <script defer src="src/audio.js"></script>
    <script defer src="src/questions.js"></script>
    <script defer src="src/learning.js"></script>
    <script defer src="src/engine.js"></script>
    <script defer src="src/widgets.js"></script>
    <script defer src="src/activities/number-play.js"></script>
    <script defer src="src/activities/patterns.js"></script>
    <script defer src="src/activities/count.js"></script>
    <script defer src="src/activities/tenframe.js"></script>
    <script defer src="src/activities/bonds.js"></script>
    <script defer src="src/activities/compare.js"></script>
    <script defer src="src/activities/order.js"></script>
    <script defer src="src/activities/add.js"></script>
    <script defer src="src/activities/sub.js"></script>
    <script defer src="src/activities/shapes.js"></script>
    <script defer src="src/screens.js"></script>
    <script defer src="src/app.js"></script>
  </body>
</html>
