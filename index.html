<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Math Garden</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#fff3d6">
<style>
:root{
  --bg:#fff3d6; --ink:#3b2f63;
  --pink:#ff86b9; --blue:#5cc6ff; --green:#5fd68a; --yellow:#ffd23f; --orange:#ff9f43; --purple:#a98bff; --red:#ff5a5f;
  --obj:clamp(36px,9.5vmin,72px);
  --btn:clamp(70px,15vmin,116px);
  --cell:clamp(38px,10vmin,80px);
  --box:clamp(50px,12vmin,94px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
  font-family:"Baloo 2","Nunito","Trebuchet MS","Arial Rounded MT Bold","Comic Sans MS",system-ui,sans-serif;font-weight:700;touch-action:manipulation}
button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}
#app{position:fixed;inset:0;background:
  radial-gradient(circle at 10% 8%,#ffe9a8 0 9%,transparent 9.2%),
  radial-gradient(circle at 92% 92%,#cdf3ff 0 14%,transparent 14.2%),
  radial-gradient(circle at 95% 10%,#ffd6ea 0 7%,transparent 7.2%),
  var(--bg)}
.screen{position:absolute;inset:0;display:none;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.screen.on{display:flex;animation:fadein .25s ease}
@keyframes fadein{from{opacity:0;transform:scale(.98)}to{opacity:1;transform:none}}

.rbtn{width:clamp(52px,10vmin,76px);height:clamp(52px,10vmin,76px);border-radius:50%;background:#fff;box-shadow:0 5px 0 #d9ccb0,0 8px 14px #0002;font-size:clamp(26px,5vmin,38px);display:flex;align-items:center;justify-content:center;flex:none;transition:transform .1s}
.rbtn:active{transform:translateY(4px);box-shadow:0 1px 0 #d9ccb0}
.rbtn.off{opacity:.5;filter:grayscale(.7)}
.bigbtn{background:var(--green);color:#fff;border-radius:999px;padding:.35em 1.1em;font-size:clamp(28px,6vmin,46px);box-shadow:0 7px 0 #38a862,0 10px 18px #0003;text-shadow:0 2px 0 #0002;display:inline-flex;align-items:center;gap:.4em}
.bigbtn:active{transform:translateY(5px);box-shadow:0 2px 0 #38a862}
.bigbtn.blue{background:var(--blue);box-shadow:0 7px 0 #2f97cc,0 10px 18px #0003}
.bigbtn.orange{background:var(--orange);box-shadow:0 7px 0 #cc7a26,0 10px 18px #0003}
.bigbtn.gray{background:#b9b0c9;box-shadow:0 7px 0 #8d84a0}

#home{padding-left:max(14px,env(safe-area-inset-left));padding-right:max(14px,env(safe-area-inset-right))}
.hhead{display:flex;align-items:center;gap:10px;padding:12px 4px 6px;flex-wrap:wrap}
.logo{font-size:clamp(28px,6.4vmin,52px);font-weight:900;flex:1;min-width:200px;line-height:1;text-shadow:0 3px 0 #fff}
.logo span{display:inline-block;animation:sway 3s ease-in-out infinite}
@keyframes sway{50%{transform:rotate(12deg) scale(1.1)}}
.starbadge{background:#fff;border-radius:999px;padding:.2em .7em;font-size:clamp(22px,4.6vmin,36px);box-shadow:0 4px 0 #ecdcb4;display:flex;gap:.3em;align-items:center}
.modebar{display:flex;gap:8px;padding:4px 4px 8px;align-items:center;justify-content:center}
.modebtn{font-size:clamp(24px,5vmin,40px);padding:.15em .9em;border-radius:999px;background:#fff;box-shadow:0 5px 0 #d9ccb0;opacity:.75}
.modebtn.on{background:var(--purple);color:#fff;opacity:1;box-shadow:0 5px 0 #7a5fd6}
.cards{flex:1;overflow:auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(44vw,230px),1fr));gap:clamp(10px,2.4vmin,22px);padding:6px 4px 110px;align-content:start}
.card{position:relative;border-radius:28px;padding:12px 8px 10px;background:var(--c);color:#fff;text-shadow:0 2px 0 #0003;
  box-shadow:0 8px 0 var(--d),0 12px 18px #0002;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:clamp(120px,24vmin,190px);transition:transform .1s}
.card:active{transform:translateY(6px);box-shadow:0 2px 0 var(--d)}
.card .ic{font-size:clamp(46px,11vmin,88px);line-height:1;filter:drop-shadow(0 3px 0 #0002);display:flex;align-items:center;justify-content:center;height:clamp(50px,12vmin,94px)}
.card .ic svg{height:100%;width:auto;max-width:80%}
.card .nm{font-size:clamp(20px,4.4vmin,32px);font-weight:900;line-height:1.05;text-align:center}
.card .lv{display:flex;gap:5px;margin-top:4px}
.lvd{display:inline-block;width:clamp(10px,2vmin,15px);height:clamp(10px,2vmin,15px);border-radius:50%;background:#fff5;border:2px solid #fff9}
.lvd.on{background:#fff;border-color:#fff}
.bottombar{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:flex-end;padding:10px 14px calc(10px + env(safe-area-inset-bottom));pointer-events:none}
.bottombar>*{pointer-events:auto}
.stickerbtn{background:var(--pink);color:#fff;border-radius:999px;padding:.25em .9em;font-size:clamp(24px,5vmin,40px);box-shadow:0 6px 0 #d2508a,0 10px 16px #0002;display:flex;gap:.3em;align-items:center}
.stickerbtn:active{transform:translateY(4px)}
.parentwrap{display:flex;flex-direction:column;align-items:center;font-size:12px;opacity:.75}
#parentBtn{--p:0deg;width:clamp(48px,9vmin,64px);height:clamp(48px,9vmin,64px);border-radius:50%;background:conic-gradient(var(--purple) var(--p),#e4dcf5 0);position:relative;font-size:26px;display:flex;align-items:center;justify-content:center}
#parentBtn::before{content:"";position:absolute;inset:6px;background:#fff;border-radius:50%}
#parentBtn span{position:relative}
.toggles{display:flex;gap:8px}

.top{display:flex;align-items:center;gap:10px;padding:10px 14px 4px}
.progress{flex:1;display:flex;justify-content:center;align-items:center;gap:clamp(4px,1vmin,9px);flex-wrap:wrap;min-height:34px}
.pd{width:clamp(16px,3.6vmin,28px);height:clamp(16px,3.6vmin,28px);border-radius:50%;background:#eadfc6;display:flex;align-items:center;justify-content:center;font-size:clamp(14px,3.2vmin,24px);line-height:1}
.pd.cur{background:var(--orange);transform:scale(1.3);animation:pulse 1.2s infinite}
.pd.done{background:none}
.lvpill{display:flex;gap:4px;padding:6px 10px;background:#fff;border-radius:999px;box-shadow:0 3px 0 #ecdcb4}
.lvpill .lvd,.ptable .lvd{border-color:#d3c6ea;background:#fff}.lvpill .lvd.on,.ptable .lvd.on{background:var(--purple);border-color:var(--purple)}
.promptbar{display:flex;align-items:center;justify-content:center;gap:12px;padding:4px 14px;font-size:clamp(24px,5.6vmin,46px);font-weight:900;text-align:center;line-height:1.15;min-height:clamp(54px,11vmin,90px)}
#prompt{display:flex;align-items:center;gap:.35em;flex-wrap:wrap;justify-content:center}
#prompt .emo{font-size:1.2em}
#prompt b{color:var(--purple);font-size:1.15em}
#prompt b.big{font-size:1.6em;color:var(--pink)}
#prompt b.more{color:#2fae63}#prompt b.less{color:#e07a10}
.stageOuter{flex:1;overflow:auto;display:flex;padding:4px 12px;min-height:0}
#stage{margin:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(8px,2.4vmin,26px);max-width:100%;padding:6px 0}
#stage.cnt-st{--obj:clamp(28px,7.4vmin,58px);--cell:clamp(30px,7.8vmin,60px)}
#stage.cnt-st.small{--obj:clamp(22px,4.6vmin,40px);--cell:clamp(24px,5.6vmin,44px)}
#stage.small{--obj:clamp(28px,7vmin,52px);--cell:clamp(34px,8vmin,64px)}
.fb{min-height:clamp(78px,14vmin,120px);display:flex;align-items:center;justify-content:center;gap:16px;padding:6px 14px calc(8px + env(safe-area-inset-bottom));text-align:center}
.fbtext{font-size:clamp(22px,5vmin,40px);font-weight:900;display:flex;gap:.5em;align-items:center;flex-wrap:wrap;justify-content:center}
.fbtext .praise{color:#2fae63}.fbtext .oops{color:#e07a10}
.fbtext .note{background:#fff;border-radius:18px;padding:.1em .6em;box-shadow:0 4px 0 #ecdcb4;color:var(--ink)}
#nextBtn{display:none;width:clamp(70px,14vmin,104px);height:clamp(70px,14vmin,104px);border-radius:50%;background:var(--green);color:#fff;font-size:clamp(38px,8vmin,60px);box-shadow:0 7px 0 #38a862,0 10px 16px #0003;align-items:center;justify-content:center;animation:pulse 1s infinite}
#nextBtn.show{display:flex}
@keyframes pulse{50%{transform:scale(1.1)}}

.choices{display:flex;gap:clamp(10px,2.6vmin,24px);flex-wrap:wrap;justify-content:center;transition:opacity .3s}
.choices.locked{opacity:.3;pointer-events:none}
.numbtn{min-width:var(--btn);height:var(--btn);border-radius:26px;font-size:clamp(38px,9vmin,68px);font-weight:900;color:#fff;text-shadow:0 3px 0 #0003;
  background:var(--c);box-shadow:0 8px 0 var(--d),0 12px 16px #0002;transition:transform .1s,opacity .2s;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 .3em;position:relative}
.numbtn:active{transform:translateY(6px);box-shadow:0 2px 0 var(--d)}
.c0{--c:#ff86b9;--d:#d2508a}.c1{--c:#5cc6ff;--d:#2f97cc}.c2{--c:#ffb340;--d:#cc8412}.c3{--c:#a98bff;--d:#7a5fd6}.c4{--c:#4fd08a;--d:#2f9d63}
.numbtn.soft{opacity:.25;transform:scale(.88);pointer-events:none}
.numbtn.right{animation:hop .6s ease}
.numbtn.glow{animation:glow 1s ease-in-out infinite}
.numbtn.dragging{z-index:60;transition:none;box-shadow:0 14px 20px #0004}
@keyframes glow{50%{box-shadow:0 0 0 10px #ffd23fcc,0 8px 0 var(--d,#e2b600);transform:scale(1.1)}}
@keyframes hop{30%{transform:translateY(-18px) scale(1.15)}60%{transform:translateY(0) scale(.95)}}
.numbtn.wide{min-width:calc(var(--btn)*2)}
.numbtn.tok{font-size:clamp(34px,8vmin,60px);background:#fff;color:var(--ink);text-shadow:none;box-shadow:0 8px 0 #d9ccb0,0 12px 16px #0002}
.numbtn.shb{background:#fff;padding:8px;width:calc(var(--btn)*1.25);height:calc(var(--btn)*1.25);color:var(--ink);text-shadow:none;box-shadow:0 8px 0 #d9ccb0,0 12px 16px #0002}
.numbtn.shb svg{width:100%;height:100%}
.numbtn .lab{font-size:.32em;color:var(--ink);text-shadow:none;background:#fff;border-radius:10px;padding:0 .4em;position:absolute;bottom:-.9em;white-space:nowrap;box-shadow:0 2px 0 #0002}
.numbtn.huge{min-width:calc(var(--btn)*1.5);height:calc(var(--btn)*1.5);font-size:clamp(50px,13vmin,100px)}
.numbtn .mdots{margin-top:2px}

.field{display:grid;gap:clamp(2px,.8vmin,8px);justify-items:center;align-items:center;background:#fff9;border-radius:28px;padding:clamp(8px,2vmin,18px);border:3px dashed #ffffffcc}
.field .item,.field .slot{width:calc(var(--obj)*1.25);height:calc(var(--obj)*1.25);display:flex;align-items:center;justify-content:center;position:relative;font-size:var(--obj);line-height:1;cursor:pointer}
.item .emo{display:block;transition:transform .2s,opacity .2s}
.item.counted .emo{animation:hop .5s}
.item.counted{filter:drop-shadow(0 0 6px #ffd23f)}
/* .badge = number-free highlight ring shown while counting together */
.badge{position:absolute;inset:-2px;border:5px solid var(--purple);border-radius:50%;background:transparent;box-shadow:0 0 10px #a98bff99;animation:pop .3s ease;z-index:2;pointer-events:none}
.badge.b2{border-color:var(--orange);box-shadow:0 0 10px #ff9f4399}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
.item.gone .emo,.item.gone .cnt{opacity:.25;filter:grayscale(1);transform:scale(.8)}
.item.gone::after{content:"✖";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--red);font-size:calc(var(--obj)*1.05);text-shadow:0 2px 0 #fff;animation:pop .25s}
.item.keep{animation:glow2 .9s ease-in-out 2}
@keyframes glow2{50%{transform:scale(1.25);filter:drop-shadow(0 0 10px #ffd23f)}}
.item.sel{background:#ffd23f88;border-radius:50%}
.item.wig{animation:wig 1.2s ease-in-out infinite}
@keyframes wig{50%{transform:rotate(-8deg) scale(1.08)}}
.cnt{display:inline-block;width:calc(var(--obj)*.8);height:calc(var(--obj)*.8);border-radius:50%;box-shadow:inset 0 -4px 0 #0003,0 2px 0 #0002;position:relative}
.cnt.red{background:#ff5a5f}.cnt.yellow{background:#ffd23f}.cnt.blue{background:#4aa8ff}.cnt.ghost{background:#ffd23f66;border:3px dashed #e0a800;box-shadow:none}
.cnt.empty{background:transparent;border:3px dashed #c9bda5;box-shadow:none}
.item .cnt{width:calc(var(--obj)*.85);height:calc(var(--obj)*.85)}
.plus{font-size:clamp(34px,8vmin,64px);font-weight:900;color:var(--pink)}
.row{display:flex;align-items:center;justify-content:center;gap:clamp(8px,2vmin,20px);flex-wrap:wrap}
.eq{font-size:clamp(36px,8.5vmin,72px);font-weight:900;display:flex;gap:.25em;align-items:center;justify-content:center;flex-wrap:wrap}
.eq .a{color:var(--red)}.eq .b{color:#e0a800}.eq .q{color:var(--purple);background:#fff;border-radius:18px;min-width:1.1em;text-align:center;box-shadow:0 5px 0 #ecdcb4;padding:0 .1em}
.eq .op{color:var(--pink)}
.eq .q.filled{background:var(--green);color:#fff;animation:hop .5s}
.checkrow{display:flex;gap:14px}

.tfpair{display:flex;gap:clamp(12px,3vmin,30px);flex-wrap:wrap;justify-content:center}
.tfwrap{display:flex;flex-direction:column;align-items:center;gap:4px}
.tf{display:grid;grid-template-columns:repeat(5,var(--cell));grid-template-rows:repeat(2,var(--cell));gap:0;background:#3ebd7c;padding:5px;border-radius:14px;box-shadow:0 6px 0 #2a8f5a}
.tf-cell{background:#fff;border:3px solid #3ebd7c;display:flex;align-items:center;justify-content:center;position:relative;cursor:pointer;border-radius:6px}
.tf-cell .cnt{width:78%;height:78%;animation:pop .2s}
.tf-cell.target{background:#fff3b0;animation:glow2 1s ease-in-out infinite}
.tf-cell.target.on{background:#fff}
.tf-cell .badge{inset:1px;border-width:4px}
.lbl{font-size:clamp(14px,2.8vmin,22px);opacity:.7}

.bond{position:relative;width:min(70vmin,320px);height:min(52vmin,240px)}
.bond svg{position:absolute;inset:0;width:100%;height:100%}
.bc{position:absolute;width:31%;aspect-ratio:1;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:clamp(34px,9vmin,66px);font-weight:900;border:5px solid var(--bd);background:#fff;transform:translate(-50%,-50%);box-shadow:0 5px 0 #0002}
.bc.whole{left:50%;top:22%;--bd:var(--purple)}
.bc.pa{left:22%;top:78%;--bd:var(--red)}
.bc.pb{left:78%;top:78%;--bd:#e6b000}
.bc.blank{border-style:dashed;color:var(--purple);background:#f4eeff}
.bc.over{background:#d8ffe4;transform:translate(-50%,-50%) scale(1.15)}
.bc.filled{background:var(--green);color:#fff;border-style:solid;animation:hopc .5s}
@keyframes hopc{30%{transform:translate(-50%,-70%) scale(1.15)}}
.cntrow{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;align-items:center;max-width:92vw}
.cntrow .sp{width:calc(var(--obj)*.4)}
.cntrow .cnt .badge{inset:-4px;border-width:4px}

.cmp{display:flex;flex-direction:column;align-items:center;gap:0}
.crow{display:grid;background:#fff;border-radius:24px;padding:clamp(4px,1.2vmin,10px);border:5px solid #fff;box-shadow:0 6px 0 #e7d9b8;font-size:min(var(--obj),calc(74vw / var(--cols)));width:min(88vw,calc(var(--cols)*var(--obj)*1.35 + 40px));transition:transform .1s}
.crow:active{transform:translateY(4px)}
.crow.soft{opacity:.3;pointer-events:none}
.crow.right{border-color:var(--green);animation:hop .6s}
.crow.glow{animation:glowb 1s infinite}
@keyframes glowb{50%{border-color:var(--yellow);transform:scale(1.03)}}
.crow .item,.crow .slot{aspect-ratio:1;display:flex;align-items:center;justify-content:center;line-height:1;cursor:pointer}
.crow .item.extra{animation:glow2 1s ease-in-out infinite}
.cmid{display:grid;height:clamp(24px,6vmin,46px);width:min(88vw,calc(var(--cols)*var(--obj)*1.35 + 40px));padding:0 15px}
.cmid i{justify-self:center;width:0;border-left:4px dashed transparent;height:100%}
.cmid i.on{border-left-color:var(--purple)}
.mh{position:relative;width:min(92vw,640px);display:flex;flex-direction:column;gap:clamp(16px,4vmin,34px);padding:8px 0}
.mrow{background:#fff;border-radius:22px;padding:clamp(10px,2.4vmin,20px) 12px;border:5px solid #fff;box-shadow:0 6px 0 #e7d9b8;display:block;width:100%;position:relative;text-align:left}
.mrow.soft{opacity:.3;pointer-events:none}.mrow.right{border-color:var(--green);animation:hop .6s}.mrow.glow{animation:glowb 1s infinite}
.mrow .bar{height:clamp(28px,6.5vmin,50px);border-radius:999px;background-color:var(--bc);position:relative;box-shadow:inset 0 -6px 0 #0002;background-image:repeating-linear-gradient(90deg,#fff3 0 12px,#fff0 12px 24px)}
.mrow .bar .cap{position:absolute;right:-.2em;top:50%;transform:translateY(-52%);font-size:clamp(34px,8vmin,60px)}
.guide{position:absolute;pointer-events:none;border:0 dashed var(--purple);z-index:3}
.mh .guide{top:0;bottom:0;border-left-width:5px}
.mv{position:relative;display:flex;align-items:flex-end;justify-content:center;gap:clamp(30px,10vmin,90px);height:min(40vmin,320px);width:min(90vw,520px);border-bottom:6px solid #7cc576;padding:0 10px}
.mv .guide{left:0;right:0;border-top-width:5px}
.mcol,.msz{background:none;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;border-radius:20px;padding:0 8px;border:5px solid transparent;position:relative;z-index:1}
.mcol.soft,.msz.soft{opacity:.3;pointer-events:none}.mcol.right,.msz.right{animation:hop .6s;border-color:var(--green)}.mcol.glow,.msz.glow{animation:glowb 1s infinite}
.mcol .vbar{width:clamp(22px,5vmin,40px);height:100%;background:linear-gradient(90deg,#5fd68a,#3fae6a);border-radius:10px 10px 0 0;position:relative}
.mcol .vtop{position:absolute;top:0;left:50%;transform:translate(-50%,-70%);font-size:clamp(36px,9vmin,64px);line-height:1}
.msz{line-height:1}

.path{display:flex;gap:clamp(4px,1.2vmin,10px);flex-wrap:wrap;justify-content:center;align-items:flex-start}
.pcell{display:flex;flex-direction:column;align-items:center;gap:6px}
.pbox{width:var(--box);height:var(--box);border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:calc(var(--box)*.6);font-weight:900;color:#fff;text-shadow:0 2px 0 #0003;box-shadow:0 5px 0 #0002}
.pc0{background:#ff86b9}.pc1{background:#5cc6ff}.pc2{background:#ffb340}.pc3{background:#4fd08a}
.pbox.blank{background:#f4eeff;color:var(--purple);border:5px dashed var(--purple);text-shadow:none}
.pbox.over{background:#d8ffe4;transform:scale(1.15)}
.pbox.filled{background:var(--green);color:#fff;border:5px solid var(--green);animation:hop .5s;text-shadow:0 2px 0 #0003}
.mdots{display:grid;grid-template-columns:repeat(5,clamp(7px,1.8vmin,14px));gap:2px;animation:pop .3s}
.mdots i{width:clamp(7px,1.8vmin,14px);height:clamp(7px,1.8vmin,14px);border-radius:50%;background:#ff5a5f}
.mdots i.t{background:#4aa8ff}
.slots{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center}
.slot2{width:var(--box);height:var(--box);border:4px dashed #c8b8ee;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:calc(var(--box)*.6);font-weight:900;color:#fff;text-shadow:0 2px 0 #0003}
.slot2.full{border:0;animation:pop .3s}
.numbtn.wob{animation:wob .4s}
@keyframes wob{25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}

.pat{display:flex;gap:clamp(6px,1.6vmin,14px);flex-wrap:wrap;justify-content:center;align-items:center}
.punit{display:flex;gap:clamp(4px,1.2vmin,10px);padding:4px 8px 10px;border-bottom:6px solid transparent;border-radius:10px}
.pat.showunits .punit:nth-child(odd){border-bottom-color:var(--pink)}
.pat.showunits .punit:nth-child(even){border-bottom-color:var(--blue)}
.ptok{width:calc(var(--box)*1.05);height:calc(var(--box)*1.05);font-size:calc(var(--box)*.7);display:flex;align-items:center;justify-content:center;line-height:1;background:#fff;border-radius:18px;box-shadow:0 5px 0 #e7d9b8}

<script>
"use strict";
/* Math Garden - Singapore-style (Concrete-Pictorial-Abstract) math for a 5-year-old. One file, offline. */
const $=(s,e=document)=>e.querySelector(s);
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
const W=['zero','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen','twenty'];

/* ---------- persistence ---------- */
const KEY='mathgarden.v1';
const STICKERS=['🦄','🐶','🐱','🐰','🦋','🐞','🐢','🐙','🦁','🐼','🐸','🐥','🌈','🌻','🍓','🍦','🚀','🎈','🎨','👑','🐬','🦊','🐝','🍭'];
const DEFAULTS=()=>({stars:0,stickers:[],skills:{},sound:true,voice:true,mode:10,perRound:8});
function load(){
  try{const r=localStorage.getItem(KEY);if(r)return Object.assign(DEFAULTS(),JSON.parse(r))}catch(e){}
  return DEFAULTS();
}
let S=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function sk(key){return S.skills[key]||(S.skills[key]={lvl:1,streak:0,miss:0,att:0,ok:0,rounds:0})}

/* ---------- audio (soft sine/triangle chimes; started only after a user tap) ---------- */
let AC=null,MASTER=null;
function ac(){
  if(!AC){
    try{
      AC=new (window.AudioContext||window.webkitAudioContext)();
      const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=2200;lp.Q.value=.3;
      MASTER=AC.createGain();MASTER.gain.value=.9;MASTER.connect(lp);lp.connect(AC.destination);
    }catch(e){AC=null;MASTER=null}
  }
  if(AC&&AC.state!=='running'){try{AC.resume()}catch(e){}}
  return AC;
}
/* one soft note: slow attack, gentle exponential release, optional quiet 2nd harmonic for a "chime" colour */
function tone(f,t=0,d=.35,type='sine',v=.05,att=.04,bell=0){
  if(!S.sound)return;const a=ac();if(!a||!MASTER)return;
  if(type!=='triangle')type='sine';
  try{
    const t0=a.currentTime+t+.005;
    const voice=(freq,vol)=>{
      const o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.value=freq;
      g.gain.setValueAtTime(0.0001,t0);
      g.gain.linearRampToValueAtTime(vol,t0+att);
      g.gain.exponentialRampToValueAtTime(0.0001,t0+att+d);
      o.connect(g);g.connect(MASTER);o.start(t0);o.stop(t0+att+d+.05);
    };
    voice(f,v);
    if(bell)voice(f*2,v*bell);
  }catch(e){}
}
const NT={A4:440,C5:523.25,D5:587.33,E5:659.25,G5:783.99,A5:880,C6:1046.5,E6:1318.5};
const sfx={
  tap(i=0){tone(392+Math.min(i,20)*22,0,.22,'sine',.04,.03)},
  pop(){tone(523.25,0,.14,'sine',.035,.02)},
  ok(){[NT.C5,NT.E5,NT.G5].forEach((f,i)=>tone(f,i*.13,.8,'sine',.05,.05,.25))},
  oops(){tone(220,0,.6,'sine',.03,.12)},
  win(){[NT.C5,NT.E5,NT.G5,NT.C6].forEach((f,i)=>tone(f,i*.18,1.0,'sine',.05,.06,.25))},
  up(){[NT.G5,NT.C6,NT.E6].forEach((f,i)=>tone(f,i*.14,.7,'sine',.04,.05,.2))}
};

/* ---------- speech (female English voice by preference, iOS-safe) ---------- */
const VOICE_PREF=['samantha','ava','allison','karen','moira','tessa','serena','google uk english female','google us english','zira','aria','jenny'];
const MALE_RE=/(^|[^a-z])(male|fred|alex|daniel|david|mark|george|rishi|aaron|arthur|gordon|guy|ryan|thomas|oliver|junior|ralph|albert|bruce|eddy|reed|rocko|sandy|shelley|grandpa|grandma|flo)([^a-z]|$)/i;
let voiceObj=null,speechOK='speechSynthesis' in window,speechUnlocked=false,lastUtt=null;
function pickVoice(){
  if(!speechOK)return;
  try{
    const all=speechSynthesis.getVoices()||[];
    const en=all.filter(v=>/^en([-_]|$)/i.test(v.lang)||/english/i.test(v.name));
    if(!en.length)return;
    let best=null;
    for(const p of VOICE_PREF){
      const re=new RegExp('(^|[^a-z])'+p.replace(/ /g,'\\s+'),'i');
      const hits=en.filter(v=>re.test(v.name));
      if(hits.length){best=hits.find(v=>/^en[-_](us|gb)/i.test(v.lang))||hits[0];break}
    }
    if(!best)best=en.find(v=>/female/i.test(v.name));
    if(!best)best=en.find(v=>!MALE_RE.test(v.name)&&/^en[-_](us|gb)/i.test(v.lang));
    voiceObj=best||en[0];
  }catch(e){}
}
try{
  pickVoice();
  if(speechSynthesis.addEventListener)speechSynthesis.addEventListener('voiceschanged',pickVoice);else speechSynthesis.onvoiceschanged=pickVoice;
  [300,1000,2500].forEach(ms=>setTimeout(()=>{if(!voiceObj)pickVoice()},ms)); /* iOS/Safari may load voices lazily without an event */
}catch(e){speechOK=false}
/* iOS only allows speech after a real tap: speak one silent utterance on the first tap to unlock it */
function unlockSpeech(){
  if(speechUnlocked||!speechOK)return;speechUnlocked=true;
  try{const u=new SpeechSynthesisUtterance(' ');u.volume=0;speechSynthesis.speak(u)}catch(e){}
}
function say(t){
  if(!S.voice||!t||!speechOK||!speechUnlocked)return;
  try{
    if(!voiceObj)pickVoice();
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(String(t).replace(/−/g,' minus ').replace(/\+/g,' plus ').replace(/=/g,' equals '));
    u.rate=.85;u.pitch=1.1;u.volume=1;
    if(voiceObj){u.voice=voiceObj;u.lang=voiceObj.lang||'en-US'}else u.lang='en-US';
    lastUtt=u; /* keep a reference: Safari can drop utterances that get garbage-collected */
    speechSynthesis.speak(u);
    if(speechSynthesis.paused)speechSynthesis.resume();
  }catch(e){}
}

/* ---------- objects ---------- */
const OBJ=[
 {e:'🦆',s:'duck',p:'ducks',v:'swim away'},{e:'🐥',s:'chick',p:'chicks',v:'fly away'},{e:'🐟',s:'fish',p:'fish',v:'swim away'},
 {e:'🍎',s:'apple',p:'apples',v:'get eaten'},{e:'🎈',s:'balloon',p:'balloons',v:'pop'},{e:'🐸',s:'frog',p:'frogs',v:'hop away'},
 {e:'🦋',s:'butterfly',p:'butterflies',v:'fly away'},{e:'🍓',s:'strawberry',p:'strawberries',v:'get eaten'},{e:'🐞',s:'ladybug',p:'ladybugs',v:'fly away'},
 {e:'🌸',s:'flower',p:'flowers',v:'get picked'},{e:'⭐',s:'star',p:'stars',v:'fall down'},{e:'🍪',s:'cookie',p:'cookies',v:'get eaten'},
 {e:'🐰',s:'bunny',p:'bunnies',v:'hop away'},{e:'🐱',s:'kitten',p:'kittens',v:'run away'}
];
const plu=(n,o)=>n===1?o.s:o.p;
/* counting highlight: a soft ring around the object - deliberately NO numbers/sequence strip */
const badgeEl=(n,c)=>el('span','badge'+(c?' '+c:''),'');

function numOpts(ans,lo,hi,k){
  const pool=[];for(let x=lo;x<=hi;x++)if(x!==ans)pool.push({x,k:Math.abs(x-ans)+Math.random()*1.6});
  pool.sort((a,b)=>a.k-b.k);
  return shuffle([ans,...pool.slice(0,k-1).map(p=>p.x)]);
}
const HI=[0,5,8,10];
const hiOf=c=>c.m20?[0,14,17,20][c.lvl]:HI[c.lvl];
const loOf=c=>c.m20?11:1;
const nChoices=c=>c.lvl===1?3:4;

/* =====================================================================  Engine */
let R=null;
const ctl={};
function later(fn,ms){const tk=R&&R.token;setTimeout(()=>{if(R&&R.token===tk)fn()},ms)}
function seqRun(list,fn,gap,start=300){list.forEach((x,i)=>later(()=>fn(x,i),start+i*gap))}
const countGap=()=>S.voice?700:420;
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===id))}
function lvDots(n){return [1,2,3].map(i=>`<i class="lvd${i<=n?' on':''}"></i>`).join('')}

function startRound(id){
  const a=ACTS[id];const m20=S.mode===20&&!!a.m20;
  R={id,a,m20,key:id+(m20?'20':''),idx:0,total:S.perRound,ok:0,marks:[],token:0,q:null,timer:null};
  show('act');nextQ();
}
function drawProgress(){
  const p=$('#progress');p.innerHTML='';

function makeChoices(parent,opts,ans,o={}){
  const box=el('div','choices'+(o.cls?' '+o.cls:''));const btns=[];let correctBtn=null;
  opts.forEach((v,i)=>{
    const b=el('button','numbtn c'+(i%5)+(o.btnCls?' '+o.btnCls:''),o.render?o.render(v,i):String(v));
    b.type='button';b.dataset.v=v;
    if(v===ans){b.dataset.correct='1';correctBtn=b}
    const act=()=>{
      if(b.disabled||box.classList.contains('locked')||!R||R.q.done)return;
      sfx.pop();
      if(v===ans){b.classList.add('right');if(o.onRight)o.onRight(b);ctl.correct()}
      else{b.classList.add('soft');b.disabled=true;ctl.wrong()}
    };
    b.addEventListener('click',()=>{if(b._sup)return;act()});
    if(o.drop)enableDrag(b,o.drop,act);
    box.appendChild(b);btns.push(b);
  });
  parent.appendChild(box);
  R.q.glow=()=>{if(correctBtn)correctBtn.classList.add('glow');if(o.onReveal)o.onReveal()};
  return {box,btns,correctBtn};
}
function enableDrag(b,target,act){
  let sx=0,sy=0,moved=false,id=null;
  b.style.touchAction='none';
  const over=e=>{const r=target.getBoundingClientRect(),m=30;return e.clientX>r.left-m&&e.clientX<r.right+m&&e.clientY>r.top-m&&e.clientY<r.bottom+m};
  b.addEventListener('pointerdown',e=>{if(b.disabled)return;id=e.pointerId;sx=e.clientX;sy=e.clientY;moved=false;try{b.setPointerCapture(id)}catch(_){}});
  b.addEventListener('pointermove',e=>{
    if(id!==e.pointerId)return;const dx=e.clientX-sx,dy=e.clientY-sy;
    if(!moved&&Math.hypot(dx,dy)>12){moved=true;b.classList.add('dragging')}
    if(moved){b.style.transform=`translate(${dx}px,${dy}px) scale(1.15)`;target.classList.toggle('over',over(e))}
  });
  b.addEventListener('pointerup',e=>{
    if(id!==e.pointerId)return;id=null;target.classList.remove('over');
    if(moved){const ok=over(e);b.classList.remove('dragging');b.style.transform='';b._sup=true;setTimeout(()=>b._sup=false,80);if(ok)act()}
  });
  b.addEventListener('pointercancel',()=>{id=null;moved=false;b.classList.remove('dragging');b.style.transform='';target.classList.remove('over')});
}
function checkBtn(parent,fn){

const DICE={1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
function mkItem(e){return el('div','item','<span class="emo">'+e+'</span>')}
function diceEl(n,e,items){

function frameEl(n,e,items){

  for(let i=0;i<10;i++){const c=el('div','tf-cell');if(i<n){const it=mkItem(e);c.appendChild(it);items.push(it)}f.appendChild(c)}
  return f;
}
function rowEl(n,e,items,gap){

  return r;
}
/* kind: dice (1-6) | two (two dice, up to 12) | frame (ten frame, up to 10) | fives (rows of five) | teen (two ten frames, 11-20) */
function layoutFor(n,kind,e){
  const items=[];const w=el('div','lay');
  if(n===0){w.appendChild(el('div','item','<span class="emo" style="font-size:var(--obj)">🍽️</span>'));return {el:w,items}}
  if(kind==='dice')w.appendChild(diceEl(n,e,items));
  else if(kind==='two'){const a=Math.ceil(n/2),b=n-a;w.appendChild(diceEl(a,e,items));w.appendChild(diceEl(b,e,items))}
  else if(kind==='frame')w.appendChild(frameEl(n,e,items));
  else if(kind==='teen'){
    const p=el('div','tfpair');
    const wrap=x=>{const q=el('div','tfwrap');q.appendChild(x);return q};
    p.appendChild(wrap(frameEl(10,e,items)));p.appendChild(wrap(frameEl(n-10,e,items)));w.appendChild(p);
  }else{
    const f=el('div','fives');const rows=Math.ceil(n/5);
    for(let r=0;r<rows;r++)f.appendChild(rowEl(Math.min(5,n-r*5),e,items,n>10&&r===1));
    w.appendChild(f);
  }
  return {el:w,items};
}
function kindsFor(c,n){
  if(c.m20)return c.lvl===1?['teen','fives']:['teen','fives','fives'];
  if(c.lvl===1)return n<=5?['dice','fives']:['frame'];
  if(c.lvl===2)return n<=6?['dice','frame','fives']:['frame','two','fives'];
  return n<=6?['dice','frame','two']:['frame','two','fives'];

/* 7. SUBTRACT */
ACTS.sub={name:'Take Away',color:['#7c8cff','#4b58d6'],icon:'<div style="font-size:.8em;text-shadow:0 3px 0 #0003;white-space:nowrap">🐥➖🐥</div>',skill:'Subtraction as taking away (picture stories, crossing out, equations)',
 note:'Picture stories (5 chicks, 2 fly away): cross out the ones taken away and find how many are left; later the equation 5 − 2 = 3.',
 make(c,st){
  const hi=HI[c.lvl];const zero=c.lvl===3&&Math.random()<.1;
  const n=rnd(2,hi);const k=zero?n:rnd(1,n-1);const left=n-k;
  const eqType=c.lvl>1&&Math.random()<(c.lvl===2?.4:.6);
  st.dataset.type=eqType?'sub-eq':'sub-story';
  const o=pick(OBJ);
  ctl.note(`${n} − ${k} = ${left}`,`${W[n]} take away ${W[k]} leaves ${W[left]}`);
  let f,eq=null;
  if(!eqType){
    ctl.ask(`<b class="big">${k}</b> <span class="emo">${o.e}</span> 💨 How many left?`,`${W[n]} ${o.p}. ${W[k]} ${o.v}. Cross out ${W[k]}. How many are left?`);
    f=field(n,o.e,{cols:5,rows:Math.ceil(n/5),showEmpty:false});st.appendChild(f.el);
    st.appendChild(el('div','fbtext',`<span style="font-size:.6em;opacity:.7">${n} ${plu(n,o)}, ${k} ${o.v}</span>`));
  }else{
    ctl.ask(`<b>${n}</b> − <b>${k}</b> = <b class="big">?</b>`,`${W[n]} take away ${W[k]} equals how many? Cross out ${W[k]}.`);
    eq=el('div','eq',`<span class="a">${n}</span><span class="op">−</span><span class="b">${k}</span><span class="op">=</span><span class="q">?</span>`);st.appendChild(eq);
    f=field(n,'<span class="cnt red"></span>',{cols:5,rows:Math.ceil(n/5),showEmpty:false});st.appendChild(f.el);
  }
  const items=f.items;
  const fillQ=()=>{if(eq){const q=$('.q',eq);q.textContent=left;q.classList.add('filled')}};
  const ch=makeChoices(st,numOpts(left,0,Math.max(hi,n),nChoices(c)),left,{onRight:fillQ,onReveal:fillQ});
  ch.box.classList.add('locked');items.forEach(i=>i.classList.add('wig'));
  const gone=()=>items.filter(i=>i.classList.contains('gone'));
  items.forEach(it=>it.addEventListener('click',()=>{
    if(R.q.done)return;
    if(it.classList.contains('gone'))it.classList.remove('gone');
    else if(gone().length<k){it.classList.add('gone');sfx.tap(gone().length);say(W[gone().length])}
    const ok=gone().length===k;ch.box.classList.toggle('locked',!ok);
    items.forEach(i=>i.classList.toggle('wig',!ok&&!i.classList.contains('gone')));
  }));
  const hint=()=>{
    ch.box.classList.remove('locked');items.forEach(i=>i.classList.remove('wig'));
    const need=k-gone().length;
    items.filter(i=>!i.classList.contains('gone')).slice(0,Math.max(need,0)).forEach(t=>t.classList.add('gone'));
    const rest=items.filter(i=>!i.classList.contains('gone'));
    rest.forEach(i=>{const b=i.querySelector('.badge');if(b)b.remove()});
    seqRun(rest,(it,i)=>{it.classList.add('keep');it.appendChild(badgeEl(i+1,'b2'));sfx.tap(i+1);say(W[i+1])},countGap());
  };
  ctl.hint(hint);ctl.reveal(hint);
 }};

/* 8. SHAPES & PATTERNS */
const SHAPE_COL=['#ff86b9','#5cc6ff','#ffb340','#a98bff','#4fd08a','#ff6b6b'];
const POLY={
  triangle:[[50,10],[92,86],[8,86]],
  square:[[12,12],[88,12],[88,88],[12,88]],
  rectangle:[[4,26],[96,26],[96,74],[4,74]],
  hexagon:[[50,6],[89,28],[89,72],[50,94],[11,72],[11,28]]
};
function starPts(){const p=[];for(let i=0;i<10;i++){const r=i%2?19:46,a=-Math.PI/2+i*Math.PI/5;p.push([50+r*Math.cos(a),52+r*Math.sin(a)])}return p}
function shapeSVG(name,fill,rot=0,extra=''){
  let inner;
  const st=`fill="${fill}" stroke="#0002" stroke-width="3" stroke-linejoin="round"`;
  if(name==='circle')inner=`<circle cx="50" cy="50" r="42" ${st}/>`;
  else if(name==='star')inner=`<polygon points="${starPts().map(p=>p.join(',')).join(' ')}" ${st}/>`;
  else inner=`<polygon points="${POLY[name].map(p=>p.join(',')).join(' ')}" ${st}/>`;
  return `<svg viewBox="0 0 100 100"><g transform="rotate(${rot} 50 50)">${inner}</g>${extra}</svg>`;
}
const TOKENS=[['🔴','🔵','🟡','🟢','🟣','🟠'],['🐱','🐶','🐸','🐰','🐥','🐟'],['🍎','🍌','🍇','🍓','🍊'],['🔺','🟦','⭕','⭐','💗','🟩']];
ACTS.shapes={name:'Shapes & Patterns',color:['#f0b429','#c48a00'],icon:'<svg viewBox="0 0 120 50"><circle cx="20" cy="26" r="18" fill="#ff86b9"/><rect x="45" y="8" width="34" height="34" rx="4" fill="#5cc6ff"/><polygon points="102,6 120,44 84,44" fill="#4fd08a"/></svg>',
 skill:'Shapes (circle, square, triangle, rectangle…) and repeating patterns (AB, AAB, ABB, ABC)',
 note:'Finds named shapes, counts sides, and completes AB / AAB / ABB / ABC patterns.',
 make(c,st){
  const r=Math.random();
  const type=c.lvl<3?(r<.35?'find':'pat'):(r<.3?'find':r<.45?'sides':'pat');
  st.dataset.type='shape-'+type;
  if(type==='find'){
    const pool=c.lvl===1?['circle','square','triangle']:c.lvl===2?['circle','square','triangle','rectangle']:['circle','square','triangle','rectangle','hexagon','star'];
    const k=c.lvl===1?3:4;const opts=shuffle(pool).slice(0,k);const ans=pick(opts);
    const cols=shuffle(SHAPE_COL);
    ctl.ask(`Tap the <b class="big">${ans}</b>`,`Tap the ${ans}.`);ctl.note(ans,`This is a ${ans}`);
    const rots={};
    opts.forEach(o=>{rots[o]=c.lvl===3?rnd(-25,25):(o==='rectangle'&&Math.random()<.5?90:0)});
    const ch=makeChoices(st,opts,ans,{btnCls:'shb',render:(v,i)=>shapeSVG(v,cols[i],rots[v])});
    const lab=()=>ch.btns.forEach(b=>{if(!b.querySelector('.lab'))b.appendChild(el('span','lab',b.dataset.v))});
    ctl.hint(lab);ctl.reveal(lab);
  }else if(type==='sides'){
    const nm=pick(['triangle','square','rectangle','hexagon']);const n=POLY[nm].length;
    ctl.ask('How many <b>sides</b>?','How many sides does this shape have? Count along the edges.');ctl.note(`${n} sides`,`${W[n]} sides`);
    const pts=POLY[nm];
    let extra='';pts.forEach((p,i)=>{const q=pts[(i+1)%pts.length];const mx=(p[0]+q[0])/2,my=(p[1]+q[1])/2;extra+=`<g class="sb" data-i="${i}"><circle cx="${mx}" cy="${my}" r="9" fill="#a98bff"/><text x="${mx}" y="${my+5}" font-size="14" font-weight="900" fill="#fff" text-anchor="middle">${i+1}</text></g>`});
    const big=el('div','shapebig',shapeSVG(nm,pick(SHAPE_COL),0,extra));st.appendChild(big);
    makeChoices(st,numOpts(n,3,6,nChoices(c)),n);
    const hint=()=>{[...big.querySelectorAll('.sb')].forEach(g=>g.classList.remove('vis'));seqRun([...Array(n).keys()],(i)=>{big.querySelector(`.sb[data-i="${i}"]`).classList.add('vis');sfx.tap(i+1);say(W[i+1])},countGap())};
    ctl.hint(hint);ctl.reveal(hint);
  }else{
    const units=c.lvl===1?['AB']:c.lvl===2?['AB','AAB','ABB']:['AAB','ABB','ABC','AB'];
    const u=pick(units);const toks=shuffle(pick(TOKENS));
    const map={A:toks[0],B:toks[1],C:toks[2]};
    const total=Math.max(6,u.length*2);
    const seq=[];for(let i=0;i<total;i++)seq.push(map[u[i%u.length]]);
    const bi=c.lvl===1?total-1:rnd(u.length,total-1);
    const ans=seq[bi];
    ctl.ask(bi===total-1?'What comes <b>next</b>?':'What is <b>missing</b>?',bi===total-1?'What comes next in the pattern?':'What is missing in the pattern?');
    ctl.note('It repeats!','The pattern repeats.');
    const pat=el('div','pat');let unit=null,blank=null;
    seq.forEach((t,i)=>{
      if(i%u.length===0){unit=el('div','punit');pat.appendChild(unit)}
      const x=el('div','ptok',i===bi?'?':t);if(i===bi){x.classList.add('blank');blank=x}unit.appendChild(x);
    });
    st.appendChild(pat);
    const uniq=[...new Set(u.split('').map(k=>map[k]))];
    const dis=toks.find(t=>!uniq.includes(t));
    const opts=[...uniq,dis];
    const fill=()=>{blank.textContent=ans;blank.classList.remove('blank');blank.classList.add('filled')};
    makeChoices(st,shuffle(opts),ans,{btnCls:'tok',drop:blank,onRight:fill,onReveal:fill});
    const units2=()=>pat.classList.add('showunits');
    ctl.hint(units2);ctl.reveal(units2);
  }
 }};

/* =====================================================================  Screens */
const ORDER=['count','tenframe','bonds','compare','order','add','sub','shapes'];
function renderHome(){
  $('#starCount').textContent=S.stars;
  $('#stkCount').textContent=S.stickers.length;$('#stkTotal').textContent=STICKERS.length;
  $('#tSound').classList.toggle('off',!S.sound);$('#tSound').textContent=S.sound?'🔔':'🔕';
  $('#tVoice').classList.toggle('off',!S.voice);$('#tVoice').textContent=S.voice?'🗣️':'🤐';
  $('#m10').classList.toggle('on',S.mode===10);$('#m20').classList.toggle('on',S.mode===20);
  const box=$('#cards');box.innerHTML='';
  ORDER.forEach(id=>{
    const a=ACTS[id];if(S.mode===20&&!a.m20)return;
    const key=id+(S.mode===20?'20':'');const s=sk(key);
    const b=el('button','card');b.type='button';b.dataset.act=id;b.style.setProperty('--c',a.color[0]);b.style.setProperty('--d',a.color[1]);
    b.innerHTML=`<div class="ic">${a.icon}</div><div class="nm">${S.mode===20&&a.m20name?a.m20name:a.name}</div><div class="lv">${lvDots(s.lvl)}</div>`;
    b.addEventListener('click',()=>{ac();unlockSpeech();startRound(id)});
    box.appendChild(b);
  });
}
function renderStickers(){
  $('#starCount2').textContent=S.stars;
  const g=$('#stkGrid');g.innerHTML='';
  STICKERS.forEach(s=>g.appendChild(el('div','stk'+(S.stickers.includes(s)?'':' lock'),s)));
}
function renderParent(){
  const rows=[];
  const add=(id,m20)=>{const a=ACTS[id];const key=id+(m20?'20':'');const s=S.skills[key]||{lvl:1,att:0,ok:0,rounds:0};
    const pct=s.att?Math.round(100*s.ok/s.att):0;
    rows.push(`<tr><td><b>${m20?'11–20 ':''}${a.name}</b><div class="small-note">${a.note}</div></td><td>${lvDots(s.lvl)}</td><td>${s.rounds}</td><td>${s.att}</td><td>${s.att?pct+'%':'–'}<div class="bar2"><i style="width:${pct}%"></i></div></td></tr>`)};
  ORDER.forEach(id=>add(id,false));ORDER.forEach(id=>{if(ACTS[id].m20)add(id,true)});
  $('#parBody').innerHTML=`
   <p class="small-note">Progress is saved on this device only. "First-try" = answered correctly without needing a hint. Levels adapt: 3 first-try answers in a row → harder; 2 misses in a row → easier. Wrong answers are never penalised: the concrete objects are shown and she can try again.</p>
   <table class="ptable"><tr><th>Skill</th><th>Level (1–3)</th><th>Rounds</th><th>Questions</th><th>First-try</th></tr>${rows.join('')}</table>
   <div class="pset"><b>⭐ ${S.stars}</b> stars · <b>🎁 ${S.stickers.length}/${STICKERS.length}</b> stickers</div>
   <div class="pset"><span>Questions per round:</span>${[6,8,10].map(n=>`<button class="modebtn${S.perRound===n?' on':''}" data-pr="${n}">${n}</button>`).join('')}</div>
   <div class="pset"><button class="modebtn${S.sound?' on':''}" id="pSound">🔔 Sounds ${S.sound?'on':'off'}</button><button class="modebtn${S.voice?' on':''}" id="pVoice">🗣️ Voice ${S.voice?'on':'off'}</button></div>
   <div class="pset" id="resetArea"><button class="bigbtn orange" id="resetBtn" style="font-size:20px">Reset all progress</button></div>`;
  $('#parBody').querySelectorAll('[data-pr]').forEach(b=>b.onclick=()=>{S.perRound=+b.dataset.pr;save();renderParent()});
  $('#pSound').onclick=()=>{S.sound=!S.sound;save();renderParent()};
  $('#pVoice').onclick=()=>{S.voice=!S.voice;save();renderParent()};
  $('#resetBtn').onclick=()=>{
    $('#resetArea').innerHTML=`<span>Erase stars, stickers and progress?</span><button class="bigbtn orange" id="resetYes" style="font-size:20px">Yes, erase</button><button class="bigbtn gray" id="resetNo" style="font-size:20px">Cancel</button>`;
    $('#resetYes').onclick=()=>{const keep={sound:S.sound,voice:S.voice,perRound:S.perRound};S=Object.assign(DEFAULTS(),keep);save();renderParent();renderHome()};
    $('#resetNo').onclick=renderParent;
  };
}

/* ---------- wiring ---------- */
$('#tSound').onclick=()=>{S.sound=!S.sound;save();renderHome();if(S.sound){ac();sfx.ok()}};
$('#tVoice').onclick=()=>{S.voice=!S.voice;save();renderHome();if(S.voice){unlockSpeech();say('Hello, friend! Let us play with numbers together.')}};
$('#m10').onclick=()=>{S.mode=10;save();renderHome()};
$('#m20').onclick=()=>{S.mode=20;save();renderHome()};
$('#stkBtn').onclick=()=>{renderStickers();show('stk')};
$('#stkBack').onclick=goHome;
$('#parBack').onclick=goHome;
$('#homeBtn').onclick=goHome;
$('#replayBtn').onclick=()=>{if(R&&R.q){const v=S.voice;S.voice=true;say(R.q.speech);S.voice=v}};
$('#nextBtn').onclick=()=>{if(R&&R.q&&R.q.done)advance()};
['pointerup','touchend','click'].forEach(ev=>document.addEventListener(ev,()=>{ac();unlockSpeech()},{capture:true,passive:true}));
document.addEventListener('contextmenu',e=>e.preventDefault());

(function(){ /* parent corner: hold 3 seconds */
  const b=$('#parentBtn');let iv=null,t0=0;
  const stop=()=>{if(iv){clearInterval(iv);iv=null}b.style.setProperty('--p','0deg')};
  b.addEventListener('pointerdown',()=>{
    stop();t0=performance.now();
    iv=setInterval(()=>{
      const p=Math.min(1,(performance.now()-t0)/3000);b.style.setProperty('--p',(p*360)+'deg');
      if(p>=1){stop();renderParent();show('par')}
    },40);
  });
  ['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,stop));
})();

renderHome();
